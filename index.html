<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road To TGC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@300;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="wrapper">

    <header>
        <p class="label">Training Program · 2026</p>
        <h1>Road To <span>TGC</span></h1>
        <p class="subtitle">41-week training plan &mdash; track your progress</p>
    </header>

    <div class="progress-wrap">
        <div class="progress-header">
            <span>Progreso general</span>
            <strong id="pct">3 / 12 semanas</strong>
        </div>
        <div class="bar"><div class="bar-fill" id="bar"></div></div>
    </div>

    <nav class="grid" id="grid" aria-label="Semanas de entrenamiento">
        <!-- Cards generadas por JS -->
    </nav>

    <footer>
        <span><span class="dot"></span>Activo</span>
        <span>Road To TGC &copy; 2026</span>
    </footer>

</div>

<script src="js/index.js"></script>
</body>
</html>
